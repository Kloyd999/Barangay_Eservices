{% extends 'base/base.html' %}
{% block title %}Login - Barangay E-Services{% endblock %}

{% block full_page %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5"
     style="background: linear-gradient(135deg, #0d3b6e 0%, #1565c0 100%);">
    <div class="card shadow-lg border-0" style="width:100%;max-width:420px;">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-building text-primary fs-2"></i>
                </div>
                <h4 class="fw-bold mb-1">Barangay E-Services</h4>
                <p class="text-muted small">Sign in to your account</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-medium small">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0"
                               id="username" name="username" placeholder="Enter your username"
                               required autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0"
                               id="password" name="password" placeholder="Enter your password"
                               required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted small mb-0">
                Don't have an account?
                <a href="{% url 'authentication:register' %}" class="text-primary fw-medium">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
