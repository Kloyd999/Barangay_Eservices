{% extends 'base/base.html' %}

{% block title %}Dashboard - Barangay E-Services{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Dashboard</h1>
    <p>Welcome, {{ username }}!</p>
    <ul class="list-group">
        <li class="list-group-item"><a href="{% url 'residents:resident_list' %}">Manage Residents</a></li>
        <li class="list-group-item"><a href="{% url 'complaints:complaint_list' %}">Manage Complaints</a></li>
        <li class="list-group-item"><a href="{% url 'services:service_list' %}">Manage Service Requests</a></li>
    </ul>
    <form method="post" action="{% url 'authentication:logout_user' %}" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>
</div>
{% endblock %}
